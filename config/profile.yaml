# 个人求职 Profile 配置示例
user_profile:
  degree: "硕士"                 # 学历: 本科 / 硕士 / 博士 / 大专
  school: "浙江大学"              # 学校名称
  major: "计算机科学与技术"        # 专业
  batch: "2026届秋招"            # 招聘批次: 2026届秋招 / 2026届春招 / 社招
  target_industry: "互联网/软件/人工智能" # 目标行业
  company_type: "大厂/国企/外企"  # 公司性质: 国企 / 外企 / 民企 / 大厂 / 独角兽
  company_size: "1000人以上"       # 公司规模: 100-500人 / 500-1000人 / 1000人以上
  location: "杭州/上海"            # 期望城市
  keywords: "Python后端工程师, 算法工程师, 大模型开发" # 搜索岗位关键词
