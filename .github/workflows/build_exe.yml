name: Build Windows EXE & Auto Release

on:
  push:
    tags:
      - 'v*' # 当推送形如 v1.0.0, v1.0.1 的标签时自动发布到 Release
  workflow_dispatch: # 支持手动网页一键触发

permissions:
  contents: write # 授予自动创建 Release 的权限

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: 📥 Checkout repository
      uses: actions/checkout@v4

    - name: 🐍 Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: 📦 Install Dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests beautifulsoup4 fastapi uvicorn pydantic jinja2 openai

    - name: ⚙️ Build JobHunter.exe via PyInstaller
      run: |
        pyinstaller --clean jobhunter.spec

    - name: 📤 Upload Windows EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: JobHunter_Windows_Executable
        path: dist/JobHunter.exe

    - name: 🚀 Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        files: dist/JobHunter.exe
        name: JobHunter Windows 客户端 Release ${{ github.ref_name }}
        body: |
          🎉 **JobHunter Windows 独立客户端 Release 自动发布**

          ### 📦 使用说明：
          1. 下载下方 `JobHunter.exe` 可执行文件；
          2. 在 Windows 环境下双击运行即可；
          3. 系统将后台自动启动服务并唤起本地 Edge 或 Chrome 浏览器直接使用！
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
